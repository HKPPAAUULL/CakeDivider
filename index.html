<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>蛋糕平均分切器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #fff; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { display: flex; flex-direction: column; }

    header {
      flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
      background: #111; border-bottom: 1px solid #2a2a2a;
    }
    header h1 { font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header label { display: flex; align-items: center; gap: 8px; font-size: 15px; white-space: nowrap; }
    header input {
      width: 64px; padding: 6px 8px; font-size: 18px; text-align: center;
      color: #fff; background: #222; border: 1px solid #444; border-radius: 8px; outline: none;
    }
    header input:focus { border-color: #ffb347; }

    #stage { position: relative; flex: 1; overflow: hidden; }
    #stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #stage video { object-fit: cover; }
    #stage canvas { touch-action: none; }

    #msg {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(90%, 420px); padding: 16px; text-align: center; line-height: 1.5;
      background: rgba(0,0,0,.75); border-radius: 12px; font-size: 15px; display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>蛋糕平均分切器</h1>
    <label>分
      <input id="slices" type="number" inputmode="numeric" min="1" max="100" step="1" value="8" />
      份
    </label>
  </header>

  <main id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="msg"></div>
  </main>

  <script>
    (() => {
      const MIN = 1, MAX = 100;
      const video = document.getElementById('video');
      const canvas = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');
      const input = document.getElementById('slices');
      const msg = document.getElementById('msg');
      const stage = document.getElementById('stage');

      const state = {
        slices: clamp(parseInt(localStorage.getItem('cake.slices'), 10) || 8),
        radiusRatio: 0.42,
        rotation: -Math.PI / 2,
        w: 0, h: 0,
      };
      input.value = state.slices;

      function clamp(n) { return Math.min(MAX, Math.max(MIN, n)); }

      function showMessage(text) { msg.textContent = text; msg.style.display = 'block'; }

      // ---------- Camera ----------
      async function startCamera() {
        if (!window.isSecureContext) {
          return showMessage('相機需要安全連線：請用 https:// 或 http://localhost 開啟此頁面。');
        }
        if (!navigator.mediaDevices?.getUserMedia) {
          return showMessage('此瀏覽器不支援相機存取。');
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          });
          video.srcObject = stream;
          await video.play().catch(() => {});
        } catch (err) {
          showMessage('無法開啟相機：' + (err.name === 'NotAllowedError' ? '請允許相機權限後重新整理。' : err.message || err.name));
        }
      }

      async function keepAwake() {
        try { await navigator.wakeLock?.request('screen'); } catch (_) {}
      }
      document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

      // ---------- Overlay ----------
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        state.w = stage.clientWidth;
        state.h = stage.clientHeight;
        canvas.width = Math.round(state.w * dpr);
        canvas.height = Math.round(state.h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function strokeTwice(width, color) {
        ctx.lineWidth = width + 3;
        ctx.strokeStyle = 'rgba(0,0,0,.55)';
        ctx.stroke();
        ctx.lineWidth = width;
        ctx.strokeStyle = color;
        ctx.stroke();
      }

      function draw() {
        const { w, h, slices, rotation } = state;
        const cx = w / 2, cy = h / 2;
        const r = Math.min(w, h) * state.radiusRatio;
        ctx.clearRect(0, 0, w, h);
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        strokeTwice(3, '#ffffff');

        if (slices > 1) {
          for (let i = 0; i < slices; i++) {
            const a = rotation + (i * 2 * Math.PI) / slices;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
            strokeTwice(i === 0 ? 3 : 2, i === 0 ? '#ffb347' : '#ffffff');
          }
        }

        ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffb347';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(0,0,0,.55)';
        ctx.stroke();
      }

      // ---------- Slice input ----------
      input.addEventListener('input', () => {
        const n = parseInt(input.value, 10);
        if (Number.isFinite(n) && n >= MIN && n <= MAX) {
          state.slices = n;
          localStorage.setItem('cake.slices', n);
          draw();
        }
      });
      input.addEventListener('change', () => { input.value = state.slices; });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });

      // ---------- Gestures: 1 finger = rotate, 2 fingers = resize + rotate, double tap = reset ----------
      const pointers = new Map();
      let last = null;

      function gestureInfo() {
        const pts = [...pointers.values()];
        const cx = state.w / 2, cy = state.h / 2;
        if (pts.length === 1) {
          return { angle: Math.atan2(pts[0].y - cy, pts[0].x - cx), dist: null };
        }
        const [a, b] = pts;
        return { angle: Math.atan2(b.y - a.y, b.x - a.x), dist: Math.hypot(b.x - a.x, b.y - a.y) };
      }

      function localPoint(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (pointers.size >= 2) return;
        canvas.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, localPoint(e));
        last = gestureInfo();
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, localPoint(e));
        const cur = gestureInfo();
        if (last && (last.dist === null) === (cur.dist === null)) {
          state.rotation += cur.angle - last.angle;
          if (cur.dist && last.dist) {
            state.radiusRatio = Math.min(0.5, Math.max(0.08, state.radiusRatio * (cur.dist / last.dist)));
          }
          draw();
        }
        last = cur;
      });

      function endPointer(e) {
        pointers.delete(e.pointerId);
        last = pointers.size ? gestureInfo() : null;
      }
      canvas.addEventListener('pointerup', endPointer);
      canvas.addEventListener('pointercancel', endPointer);

      let lastTap = 0, downAt = null;
      canvas.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
      canvas.addEventListener('pointerup', (e) => {
        const now = Date.now();
        if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 10) { lastTap = 0; return; }
        if (now - lastTap < 300) {
          state.radiusRatio = 0.42;
          state.rotation = -Math.PI / 2;
          draw();
        }
        lastTap = now;
      });

      window.addEventListener('resize', resize);
      new ResizeObserver(resize).observe(stage);
      resize();
      startCamera();
      keepAwake();
    })();
  </script>
</body>
</html>
